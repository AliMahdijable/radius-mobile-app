name: rad_mysvcs
description: "MyServices Radius — Login (v2 in progress)"
publish_to: 'none'
version: 2.0.0+87

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI + motion (minimal)
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Biometric login
  local_auth: ^2.3.0

  # Token storage
  flutter_secure_storage: ^9.2.4

  # HTTP
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
