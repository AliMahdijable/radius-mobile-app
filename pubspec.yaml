name: rad_mysvcs
description: "MyServices Radius — Login (v2 in progress)"
publish_to: 'none'
version: 2.0.0+87

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI + motion (minimal)
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Biometric login
  local_auth: ^2.3.0

  # Token storage
  flutter_secure_storage: ^9.2.4

  # HTTP
  dio: ^5.7.0

  # OS permission requests (notifications etc)
  permission_handler: ^11.3.1

  # Charts (sparkline on hero revenue card, etc.)
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Generates iOS + Android app icons from a single source. Run on Mac
# after pulling: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.png'
  remove_alpha_ios: true   # Apple rejects transparent app icons
  background_color_ios: '#FFFFFF'        # white bg under the green mark
  adaptive_icon_background: '#FFFFFF'    # Android adaptive icon background
  adaptive_icon_foreground: 'assets/images/app_icon.png'

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
