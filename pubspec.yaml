name: rad_mysvcs
description: "MyServices Radius — Login (v2 in progress)"
publish_to: 'none'
version: 4.0.1+168

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI + motion (minimal)
  # Perf 2026-08-05: أبقيناها للـfallback فقط — Cairo يُحمَّل من
  # assets/fonts/ محلياً عبر Flutter font system (typography.dart)
  # بدل runtime fetch من Google CDN (كان يسبب 200-500ms flash).
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Firebase Crashlytics — يجمع stack traces + device info لكل crash
  # يحصل مع أي مدير. بدونه لا نعرف بالمشاكل إلا لمّا يشتكي المدير
  # يدوياً. مطلب 2026-08-05.
  firebase_crashlytics: ^4.1.3

  # Biometric login
  local_auth: ^2.3.0

  # Token storage
  flutter_secure_storage: ^9.2.4

  # HTTP
  dio: ^5.7.0

  # OS permission requests (notifications etc) — used as fallback when
  # Firebase isn't configured. Firebase Messaging is the primary path.
  permission_handler: ^11.3.1

  # Firebase — matches v1 exactly. The notification permission flow goes
  # through firebase_messaging which uses the same iOS API as
  # permission_handler under the hood but with proper UNUserNotificationCenter
  # delegate registration via FlutterFire's iOS plugin.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Charts (sparkline on hero revenue card, etc.)
  fl_chart: ^0.70.2

  # ICMP ping — لميزة الأجهزة (network_devices) — يعمل على iOS + Android
  dart_ping: ^10.0.1

  # SSH client — لمراقبة UBNT airOS عبر SSH (أفضل من HTTP لكل الإصدارات 5/6/7/8)
  dartssh2: ^2.22.5

  # Voice → text for the quick-search overlay's mic button. On-device
  # recognizer (no server round-trip), supports Arabic via the iOS /
  # Android system recognizers.
  speech_to_text: ^7.0.0

  # Same icon set v1 uses (lucide). Keeps v2 visually consistent with
  # the v1 mobile app the users already know.
  lucide_icons_flutter: ^3.0.0

  # Launch tel: + wa.me deep links from the subscriber detail screen's
  # call / WhatsApp action buttons.
  url_launcher: ^6.3.1

  # 2026-08-26: ميزة تحديد موقع المشترك — نسخة مطابقة لآليّة drdounat.
  # geolocator يجلب موقع الجهاز الحالي عند "استخدم موقعي الحالي".
  # flutter_map + latlong2 يعرضان خريطة OpenStreetMap بلا مفتاح ولا فوترة
  # مع دبّوس ثابت في المركز يتحرّك بتحريك الخريطة (يطابق UX نسخة الدونات).
  geolocator: ^14.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # System contact picker (مطلب 2026-06-10) — admin can tap the phone
  # field's contact icon on the add/edit subscriber sheets to pull a
  # number from the OS address book instead of re-typing. Supports
  # both iOS (Contacts framework) and Android (ContactsContract).
  flutter_contacts: ^1.1.9+2

  # تصدير التقارير — CSV/Excel + PDF + مشاركة (2026-07-10). csv خفيف
  # (pure Dart) وتفتحه Excel/Sheets مباشرة. printing/pdf يخلق PDF
  # قابل للطباعة أو المشاركة. share_plus يفتح shareSheet لحفظ
  # الملف أو إرساله. path_provider للـtemp files.
  csv: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4

  # QR generation — لتوليد صور QR دخول للمشترك (30 يوم).
  qr_flutter: ^4.1.0

  # App info — قراءة version + buildNumber ديناميكياً من pubspec/manifest
  # حتى شاشة الإعدادات "الإصدار" تُحدَّث تلقائياً بلا تعديل يدوي.
  package_info_plus: ^8.0.0

  # App badge — flutter_app_badger 1.5.0 مهجور + ماكو namespace/يستعمل
  # package= في manifestه (يفشل مع AGP 8+). بدّلنا لـplus (fork نشط،
  # نفس API — FlutterAppBadger class name محفوظ).
  flutter_app_badger_plus: ^1.0.1

  # Localization — نظام i18n بسيط قائم على JSON. يشتغل جنباً إلى جنب مع
  # flutter_localizations (الأخير للـMaterial widgets). سبب الاختيار على
  # ARB: 'button.save'.tr() أقصر بكثير من AppLocalizations.of(context)!.buttonSave.
  # مطلب 2026-07-12.
  easy_localization: ^3.0.7
  shared_preferences: ^2.3.2

  # اختيار صورة للتبليغات العامة (2026-07-14). يضغطها قبل الرفع
  # لتجنّب حفظ ميغابايتات لكل مستقبل في الطابور.
  image_picker: ^1.1.2

  # OS-level notifications للـdevice alerts (2026-08-12). ما نستعمل
  # FCM للـdevices — كلّه client-side لأن الموبايل هو الوحيد اللي
  # يقدر يوصل لأجهزة LAN خلف NAT. الإصدار 19.x متوافق مع Dart 3.4+.
  flutter_local_notifications: ^19.4.2

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Generates iOS + Android app icons from a single source. Run on Mac
# after pulling: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.png'
  remove_alpha_ios: true   # Apple rejects transparent app icons
  background_color_ios: '#FFFFFF'        # white bg under the green mark
  adaptive_icon_background: '#FFFFFF'    # Android adaptive icon background
  adaptive_icon_foreground: 'assets/images/app_icon.png'

flutter:
  uses-material-design: true
  generate: true

  assets:
    # صور الأجهزة الفعليّة — تحلّ محلّ شارة العلامة حين يُطابَق الموديل.
    - assets/devices-images/
    - assets/images/
    - assets/translations/

  # Perf 2026-08-05: Cairo مُضمَّن محلياً بدل runtime fetch من
  # google_fonts CDN. توفير 200-500ms على cold start + منع "text flash"
  # (يظهر font افتراضي ثم يتبدّل بعد الـfetch).
  fonts:
    # الخطّ الأساسي منذ 2026-08-30. أوزان ساكنة أربعة لا ملفّ متغيّر:
    # IBM Plex Sans Arabic لا يُنشر كـvariable، والسلّم لا يستعمل غير
    # 400/500/600/700 — فالأربعة تغطّيه كاملاً.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    # Cairo يبقى مُسجَّلاً: الرجوع إليه تبديل ثابت واحد في AppType.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
