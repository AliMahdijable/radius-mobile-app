org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.compiler.execution.strategy=in-process

# 2026-07-13: Google Play 16 KB page size support
# NDK 27+ يبني native libs بمحاذاة 16 KB تلقائياً، وهذه الـflags
# تضمن أن AGP لا يعيد ضغطها بطريقة تكسر المحاذاة.
android.bundle.enableUncompressedNativeLibs=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ٢٥ نوفمبر: اقتراح Google Play «تحسين الذاكرة والأداء بـR8» — تقليص الموارد المحسَّن (R8 يقلّص الكود والموارد معاً ⇒ حجمٌ أصغر
# وذاكرةٌ أقلّ). Flutter يفعّل R8 وتقليص الموارد للإصدار أصلاً؛ هذا يجعل التقليص بالطريقة المحسَّنة. مع AGP 9.0.1.
android.r8.optimizedResourceShrinking=true
