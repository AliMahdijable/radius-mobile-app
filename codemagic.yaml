# Codemagic CI/CD configuration for MyServices Radius

workflows:
  ios-release:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.mysvcs.radMysvcs"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Verify environment variables
        script: |
          echo "Checking env vars..."
          [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] && echo "ERROR: ISSUER_ID missing" && exit 1
          [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] && echo "ERROR: KEY_ID missing" && exit 1
          [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ] && echo "ERROR: PRIVATE_KEY missing" && exit 1
          echo "All env vars OK"
          echo "Key ID: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "Bundle: $BUNDLE_ID"

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch and create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true